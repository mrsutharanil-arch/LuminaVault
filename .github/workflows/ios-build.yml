name: Build & Package LuminaVault IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build LuminaVault IPA & App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Compiler & Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project LuminaVault.xcodeproj

      - name: Compile Native iOS Application
        run: |
          xcodebuild \
            -project LuminaVault.xcodeproj \
            -scheme LuminaVault \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "LuminaVault.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r LuminaVault.ipa Payload
          echo "✅ LuminaVault.ipa generated successfully!"
          ls -lh LuminaVault.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-ipa
          path: build/LuminaVault.ipa
          retention-days: 14
