name: Build & Package LuminaVault

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build LuminaVault iOS App & Package
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version & Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project LuminaVault.xcodeproj

      - name: Build Application for iOS Simulator
        run: |
          mkdir -p build/Release-iphonesimulator
          xcodebuild build \
            -project LuminaVault.xcodeproj \
            -scheme LuminaVault \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphonesimulator"

      - name: Package App Bundle & IPA
        run: |
          mkdir -p build/Payload
          cd build/Release-iphonesimulator
          zip -r -X ../../LuminaVault-iOS-Simulator-App.zip LuminaVault.app
          cd ../..
          cp -r build/Release-iphonesimulator/LuminaVault.app build/Payload/
          cd build
          zip -r LuminaVault.ipa Payload
          cd ..
          ls -lh LuminaVault-iOS-Simulator-App.zip build/LuminaVault.ipa

      - name: Upload Built App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-iOS-App
          path: LuminaVault-iOS-Simulator-App.zip
          retention-days: 14

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-IPA
          path: build/LuminaVault.ipa
          retention-days: 14
