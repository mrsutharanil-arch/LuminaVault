name: Build & Package LuminaVault

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build LuminaVault iOS App & Package
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode Version & Schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project LuminaVault.xcodeproj

      - name: Build Native ARM64 iOS App (Physical Device)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project LuminaVault.xcodeproj \
            -scheme LuminaVault \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LuminaVault.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            VALIDATE_PRODUCT=NO \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log

      - name: Diagnostic on Build Failure
        if: failure()
        run: |
          echo "=== RECENT BUILD LOG OUTPUT ==="
          tail -n 120 build.log || true
          echo "=== DETECTED COMPILATION ERRORS ==="
          grep -E "error:" build.log || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git branch -D ci-debug-log 2>/dev/null || true
          git checkout -b ci-debug-log
          git add -f build.log
          git commit -m "chore: upload build log" || true
          git push origin ci-debug-log --force || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: build.log

      - name: Package Native ARM64 iOS IPA
        run: |
          mkdir -p build/Payload
          cp -r "$RUNNER_TEMP/LuminaVault.xcarchive/Products/Applications/LuminaVault.app" build/Payload/

          echo "=== Binary & Info.plist Inspection ==="
          plutil -p build/Payload/LuminaVault.app/Info.plist | grep -E "CFBundleSupportedPlatforms|DTPlatformName|UIDeviceFamily|UIRequiredDeviceCapabilities" || true
          file build/Payload/LuminaVault.app/LuminaVault || true

          cd build
          zip -r -X LuminaVault.ipa Payload
          cd ..
          ls -lh build/LuminaVault.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-IPA
          path: build/LuminaVault.ipa
          retention-days: 14

      - name: Upload xcarchive (Full Native Archive)
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-xcarchive
          path: ${{ runner.temp }}/LuminaVault.xcarchive
          retention-days: 7
