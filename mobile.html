<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LuminaVault - Windows Phone Metro Mobile View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@200;300;400;600;700&display=swap');
    :root {
      --accent: #00a4e4;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      user-select: none;
    }
    .metro-tile {
      background-color: var(--accent);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      cursor: pointer;
    }
    .metro-tile:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="flex flex-col justify-between">

  <!-- Windows Phone Header -->
  <header class="py-2">
    <div class="text-[10px] font-black uppercase tracking-[3px] text-cyan-400">
      LUMINA VAULT
    </div>
    <div class="text-4xl font-light text-white tracking-tight">
      start
    </div>
  </header>

  <!-- Live Tiles Grid -->
  <main class="flex-1 overflow-y-auto py-2 flex flex-col gap-3">
    <!-- Camera Roll Tile -->
    <div class="metro-tile h-40 bg-[#00a4e4]">
      <div class="flex justify-between items-start">
        <span class="text-[9px] font-black uppercase tracking-widest opacity-80">PICTURES</span>
        <i class="fa-solid fa-photo-film text-base"></i>
      </div>
      <div>
        <div class="text-2xl font-light">12</div>
        <div class="text-xs font-bold">camera roll</div>
      </div>
    </div>

    <!-- 2 Medium Tiles -->
    <div class="grid grid-cols-2 gap-3">
      <div class="metro-tile aspect-square bg-[#f09609]">
        <div class="flex justify-between">
          <i class="fa-solid fa-file-invoice text-xl"></i>
          <span class="text-2xl font-light">3</span>
        </div>
        <div class="text-xs font-bold">documents OCR</div>
      </div>

      <div class="metro-tile aspect-square bg-[#7c3aed]">
        <div class="flex justify-between">
          <i class="fa-solid fa-user-group text-xl"></i>
          <span class="text-2xl font-light">3</span>
        </div>
        <div class="text-xs font-bold">people &amp; faces</div>
      </div>
    </div>

    <!-- Google Cloud Tile -->
    <div class="metro-tile h-24 bg-[#00a4e4]">
      <div class="flex justify-between">
        <span class="text-xs font-bold uppercase tracking-wider">GOOGLE PHOTOS SYNC</span>
        <span class="text-[9px] bg-black/40 px-2 py-0.5 font-bold uppercase">READY</span>
      </div>
      <div class="text-[11px] font-light">4.8 GB of 15 GB Used • Auto Backup Active</div>
    </div>

    <!-- Private Vault Tile -->
    <div class="metro-tile h-24 bg-[#c59b27]">
      <div class="flex justify-between">
        <span class="text-xs font-bold uppercase tracking-wider">PRIVATE VAULT</span>
        <i class="fa-solid fa-lock text-sm"></i>
      </div>
      <div class="text-[11px] font-light">256-bit AES-GCM • Face ID Protected</div>
    </div>
  </main>

  <!-- Windows Phone Bottom Bar -->
  <footer class="h-14 border-t border-zinc-800 flex items-center justify-around">
    <div class="flex flex-col items-center text-zinc-400">
      <div class="w-8 h-8 rounded-full border border-white/80 flex items-center justify-center text-white text-xs">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <span class="text-[8px]">search</span>
    </div>
    <div class="flex flex-col items-center text-zinc-400">
      <div class="w-8 h-8 rounded-full border border-white/80 flex items-center justify-center text-white text-xs">
        <i class="fa-solid fa-arrows-rotate"></i>
      </div>
      <span class="text-[8px]">sync</span>
    </div>
    <div class="flex flex-col items-center text-zinc-400">
      <div class="w-8 h-8 rounded-full border border-white/80 flex items-center justify-center text-white text-xs">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <span class="text-[8px]">vault</span>
    </div>
  </footer>

</body>
</html>
